<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151918">
  <title>Update Practice Looper</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#eef2ee;background:#151918;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px))}
    main{max-width:32rem;margin:auto}h1{font-size:1.35rem}p{line-height:1.6}button,a{font:inherit}button{padding:.75rem 1rem;border:0;border-radius:.5rem;background:#b6e3a9;color:#162015;min-height:44px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#c9e6bf;display:inline-block;padding:.75rem 0}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}[hidden]{display:none!important}.actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  </style>
</head>
<body>
<main>
  <h1>Update Practice Looper</h1>
  <p>This checks for a fresh app version and keeps your saved practice setup. Pause playback in other open windows first.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="actions"><button id="update" type="button">Check and update</button><a href="./">Back to Practice Looper</a></div>
</main>
<script>
(() => {
  const button = document.querySelector('#update');
  const status = document.querySelector('#status');
  let busy = false;
  let timer;
  let allowReturn = false;
  let returned = false;
  const returnToApp = () => {
    if (!allowReturn || returned) return;
    returned = true;
    clearTimeout(timer);
    location.replace('./');
  };
  const fail = (message) => {
    allowReturn = false;
    busy = false;
    clearTimeout(timer);
    button.disabled = false;
    button.textContent = 'Try again';
    status.textContent = message;
  };
  if (!('serviceWorker' in navigator) || !window.isSecureContext) {
    status.textContent = 'Updates require HTTPS and a browser that supports installed web apps.';
    button.hidden = true;
    return;
  }
  navigator.serviceWorker.addEventListener('controllerchange', returnToApp);
  button.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    button.disabled = true;
    status.textContent = 'Checking for an update…';
    timer = setTimeout(() => fail('The update did not finish. Check your connection and try again. Your saved setup has not been deleted.'), 20000);
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
      const activate = () => {
        if (!busy || !registration.waiting) return false;
        status.textContent = 'Applying the update…';
        allowReturn = true;
        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        return true;
      };
      const watch = (worker) => {
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (!busy) return;
          if (worker.state === 'installed') activate();
          if (worker.state === 'activated') {
            allowReturn = true;
            returnToApp();
          }
          if (worker.state === 'redundant') fail('The new version could not download completely. Check your connection and try again.');
        });
      };
      registration.addEventListener('updatefound', () => watch(registration.installing));
      watch(registration.installing);
      if (activate()) return;
      await registration.update();
      if (!busy || activate()) return;
      if (registration.installing) {
        watch(registration.installing);
        status.textContent = 'Downloading the update…';
      } else {
        clearTimeout(timer);
        busy = false;
        button.disabled = false;
        button.textContent = 'Check again';
        status.textContent = 'The latest app is ready. Return to Practice Looper to open it.';
      }
    } catch {
      fail('Could not reach the update. Check your connection and try again. Your saved setup has not been deleted.');
    }
  });
})();
</script>
</body>
</html>
